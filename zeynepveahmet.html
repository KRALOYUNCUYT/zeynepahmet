<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeynep & Ahmet ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --kirmizi: #d4203a;
    --kirmizi-acik: #ff6b81;
    --pembe: #ffb3c1;
    --krem: #ffe6e9;
  }

  body {
    font-family: 'Georgia', serif;
    background: radial-gradient(circle at 50% -10%, #5c0d18 0%, #2a040a 45%, #0a0002 100%);
    color: var(--krem);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Arka plan ışıltısı */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(212,32,58,0.18), transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(255,107,129,0.12), transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* Uçuşan gül yaprakları */
  .petal {
    position: fixed;
    top: -50px;
    opacity: 0.75;
    animation: fall linear infinite;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(212,32,58,0.7));
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
    padding: 50px 20px 70px;
    text-align: center;
  }

  .rose-divider {
    font-size: 28px;
    margin-bottom: 15px;
    letter-spacing: 14px;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  h1 {
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: normal;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #ffd0d8 0%, var(--kirmizi-acik) 45%, var(--kirmizi) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 25px rgba(212,32,58,0.5));
    margin-bottom: 8px;
  }

  .subtitle {
    font-style: italic;
    color: var(--pembe);
    font-size: 1.05rem;
    margin-bottom: 40px;
    opacity: 0.9;
    letter-spacing: 0.5px;
  }

  /* Sayaç */
  .counter-title {
    font-size: 0.8rem;
    color: var(--kirmizi-acik);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 35px 0 14px;
    opacity: 0.9;
  }

  .counter {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .count-box {
    flex: 1 1 70px;
    max-width: 110px;
    background: linear-gradient(160deg, rgba(212,32,58,0.18), rgba(212,32,58,0.05));
    border: 1px solid rgba(255,107,129,0.35);
    border-radius: 18px;
    padding: 18px 8px;
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 25px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .count-box:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 35px rgba(212,32,58,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .count-box .num {
    font-size: 1.9rem;
    color: var(--kirmizi-acik);
    font-weight: bold;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 15px rgba(255,107,129,0.5);
  }
  .count-box .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--pembe);
    margin-top: 6px;
  }

  /* İltifat bölümü */
  .compliment-section {
    margin-top: 55px;
    padding: 40px 25px 35px;
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(212,32,58,0.14), rgba(20,2,5,0.5));
    border: 1px solid rgba(255,107,129,0.3);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }
  .compliment-section::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,107,129,0.08), transparent 60%);
    animation: rotateGlow 20s linear infinite;
    pointer-events: none;
  }
  @keyframes rotateGlow {
    to { transform: rotate(360deg); }
  }

  .compliment-title {
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--kirmizi-acik);
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }

  #complimentText {
    font-size: clamp(1.25rem, 4vw, 1.7rem);
    font-style: italic;
    color: #fff0f3;
    line-height: 1.5;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    position: relative;
    z-index: 1;
    text-shadow: 0 2px 20px rgba(212,32,58,0.4);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #complimentText.fade {
    opacity: 0;
    transform: scale(0.92);
  }

  /* Buton */
  .btn-compliment {
    margin-top: 28px;
    position: relative;
    z-index: 1;
    padding: 16px 42px;
    font-family: 'Georgia', serif;
    font-size: 1.05rem;
    letter-spacing: 1.5px;
    color: #fff;
    background: linear-gradient(135deg, #e63950, #a80f28);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(212,32,58,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: all 0.25s ease;
    overflow: hidden;
  }
  .btn-compliment:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 15px 40px rgba(212,32,58,0.7), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn-compliment:active {
    transform: translateY(0) scale(0.98);
  }
  .btn-compliment::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: left 0.6s ease;
  }
  .btn-compliment:hover::after {
    left: 100%;
  }

  /* Uçan kalpler */
  .flying-heart {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    font-size: 24px;
    animation: flyUp 1.4s ease-out forwards;
  }
  @keyframes flyUp {
    0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-220px) scale(0.3) rotate(40deg); }
  }

  /* Müzik */
  .music-section {
    margin-top: 50px;
    padding: 26px;
    border-radius: 22px;
    background: rgba(212,32,58,0.09);
    border: 1px solid rgba(255,107,129,0.25);
    backdrop-filter: blur(8px);
  }
  .music-section p {
    color: var(--pembe);
    margin-bottom: 16px;
    font-size: 0.9rem;
    letter-spacing: 2px;
  }
  audio {
    width: 100%;
    max-width: 420px;
    height: 46px;
    filter: sepia(30%) hue-rotate(320deg) saturate(1.8);
    outline: none;
  }

  .footer {
    margin-top: 45px;
    font-size: 0.85rem;
    color: #b36677;
    font-style: italic;
    letter-spacing: 1.5px;
  }

  .heart-beat {
    display: inline-block;
    animation: beat 1.3s ease-in-out infinite;
    color: var(--kirmizi);
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="rose-divider">🥀 ❤️ 🥀</div>
  <h1>Zeynep & Ahmet</h1>
  <p class="subtitle">Bir gül bahçesinde başlayan hikayemiz...</p>

  <!-- Sayaçlar -->
  <div class="counter-title">Tanıştığımızdan beri</div>
  <div class="counter">
    <div class="count-box"><div class="num" id="t-gun">0</div><div class="label">Gün</div></div>
    <div class="count-box"><div class="num" id="t-saat">0</div><div class="label">Saat</div></div>
    <div class="count-box"><div class="num" id="t-dakika">0</div><div class="label">Dakika</div></div>
    <div class="count-box"><div class="num" id="t-saniye">0</div><div class="label">Saniye</div></div>
  </div>

  <div class="counter-title">Sevgili olduğumuzdan beri</div>
  <div class="counter">
    <div class="count-box"><div class="num" id="s-gun">0</div><div class="label">Gün</div></div>
    <div class="count-box"><div class="num" id="s-saat">0</div><div class="label">Saat</div></div>
    <div class="count-box"><div class="num" id="s-dakika">0</div><div class="label">Dakika</div></div>
    <div class="count-box"><div class="num" id="s-saniye">0</div><div class="label">Saniye</div></div>
  </div>

  <!-- İltifat -->
  <div class="compliment-section">
    <div class="compliment-title">Sana bir sözüm var...</div>
    <div id="complimentText">Butona bas da seni ne kadar sevdiğimi gör... 🥀</div>
    <button class="btn-compliment" id="btnCompliment">🌹 Bana Bir İltifat Et</button>
  </div>

  <!-- Müzik -->
  <div class="music-section">
    <p>🎵 Sana özel şarkımız 🎵</p>
    <audio controls loop>
      <source src="muzik.mp3" type="audio/mpeg">
      Tarayıcın ses elementini desteklemiyor kanka 😔
    </audio>
  </div>

  <div class="footer">
    <span class="heart-beat">❤</span> Ahmet'ten Zeynep'e <span class="heart-beat">❤</span>
  </div>
</div>

<script>
  /* ---- Uçuşan gül yaprakları ---- */
  const petalEmojis = ['🌹','🥀','❣️','❤️','💕'];
  for (let i = 0; i < 22; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.animationDuration = (7 + Math.random() * 9) + 's';
    petal.style.animationDelay = (Math.random() * 9) + 's';
    petal.style.fontSize = (14 + Math.random() * 18) + 'px';
    document.body.appendChild(petal);
  }

  /* ---- Sayaçlar ---- */
  const tanisma = new Date('2026-10-28T00:00:00+03:00');
  const sevgili = new Date('2026-11-01T00:00:00+03:00');

  function farkla(hedef) {
    let fark = new Date() - hedef;
    if (fark < 0) fark = 0;
    return {
      gun:    Math.floor(fark / 86400000),
      saat:   Math.floor((fark / 3600000) % 24),
      dakika: Math.floor((fark / 60000) % 60),
      saniye: Math.floor((fark / 1000) % 60)
    };
  }

  function guncelle() {
    const t = farkla(tanisma), s = farkla(sevgili);
    document.getElementById('t-gun').textContent = t.gun;
    document.getElementById('t-saat').textContent = t.saat;
    document.getElementById('t-dakika').textContent = t.dakika;
    document.getElementById('t-saniye').textContent = t.saniye;
    document.getElementById('s-gun').textContent = s.gun;
    document.getElementById('s-saat').textContent = s.saat;
    document.getElementById('s-dakika').textContent = s.dakika;
    document.getElementById('s-saniye').textContent = s.saniye;
  }
  guncelle();
  setInterval(guncelle, 1000);

  /* ---- İltifat havuzu ---- */
  const iltifatlar = [
    "Kocam, yavrum, bir tanem, her şeyim... ❤️",
    "Sen benim hayatımın en güzel gülüsün. 🥀",
    "Gözlerine her baktığımda kayboluyorum.",
    "Seninle her gün ilk gün gibi heyecanlı.",
    "Kalbim senin adını ezbere biliyor.",
    "Sen gülünce dünyam aydınlanıyor.",
    "Bir tanem, sen benim en tatlı alışkanlığımsın.",
    "Seninle nefes almak bile güzel.",
    "Hayatımın en doğru kararı sensin.",
    "Kocam, sen benim hem sığınağım hem yuvamsın.",
    "Sen yokken yarım, sen varken tamım.",
    "Her sabah seni düşünerek uyanıyorum.",
    "Kokusu bile başımı döndüren tek gül sensin. 🌹",
    "Sen benim kaderimdeki en güzel yazısın.",
    "Yavrum, seninle her şey daha anlamlı.",
    "Gülüşün, dünyanın en güzel melodisi.",
    "Sana her baktığımda yeniden aşık oluyorum.",
    "Sen benim kalbimin tek sahibisin. 💕",
    "Bir ömür seninle olsun, bir gün bile az.",
    "Her şeyim, sen benim en güzel hayalimsin."
  ];

  const textEl = document.getElementById('complimentText');
  const btn = document.getElementById('btnCompliment');
  let sonIndex = -1;

  function rastgeleIltifat() {
    let i;
    do {
      i = Math.floor(Math.random() * iltifatlar.length);
    } while (i === sonIndex && iltifatlar.length > 1);
    sonIndex = i;
    return iltifatlar[i];
  }

  function kalpPatlat(e) {
    const rect = btn.getBoundingClientRect();
    const merkezX = rect.left + rect.width / 2;
    const merkezY = rect.top;
    const emojiler = ['❤️','💕','🌹','🥀','💖','❣️'];

    for (let i = 0; i < 14; i++) {
      const kalp = document.createElement('div');
      kalp.className = 'flying-heart';
      kalp.textContent = emojiler[Math.floor(Math.random()*emojiler.length)];
      kalp.style.left = (merkezX + (Math.random() - 0.5) * 160) + 'px';
      kalp.style.top  = merkezY + 'px';
      kalp.style.fontSize = (16 + Math.random() * 18) + 'px';
      kalp.style.animationDelay = (Math.random() * 0.2) + 's';
      document.body.appendChild(kalp);
      setTimeout(() => kalp.remove(), 1800);
    }
  }

  btn.addEventListener('click', () => {
    kalpPatlat();
    textEl.classList.add('fade');
    setTimeout(() => {
      textEl.textContent = rastgeleIltifat();
      textEl.classList.remove('fade');
    }, 380);
  });
</script>

</body>
</html>
